<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>You're offline | Placement Tracer System</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.75rem;
      }
      p {
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #0369a1;
        color: white;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #020617;
          color: #e2e8f0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>ParSU Placement Unit</p>
      <h1>You're offline</h1>
      <p>
        Reconnect to the internet to access your Placement Tracer System records
        and submit responses. This page does not save form entries.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
